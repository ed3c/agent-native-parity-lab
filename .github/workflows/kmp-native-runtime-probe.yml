name: kmp-native-runtime-probe

on:
  pull_request:
  push:
    branches:
      - probe/kmp-native-runtime
      - probe/simulator-runtime-elevation

permissions:
  contents: read

jobs:
  envelope-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node harness/validate-runtime-envelope.mjs --selftest
      - run: node --test harness/validate-runtime-envelope.test.mjs harness/kmp-runtime-probe.test.mjs harness/extract-marked-payload.test.mjs

  kmp-android-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out parity lab
        uses: actions/checkout@v4
        with:
          path: lab
          persist-credentials: false
      - name: Check out exact KMP reference
        uses: actions/checkout@v4
        with:
          repository: ed3c/kotlin-auto-webview
          ref: bcb79473eaa6bb2e09f287462aa932a7fdab4957
          path: kmp-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe KMP Android subject for exact-navigation.v1
        run: |
          mkdir -p lab/evidence
          node lab/harness/kmp-runtime-probe.mjs \
            kmp-reference \
            lab/fixtures/exact-navigation/checkpoint.json \
            lab/evidence/kmp-reference-android-runtime.json \
            android
          node lab/harness/validate-runtime-envelope.mjs lab/evidence/kmp-reference-android-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmp-reference-android-runtime
          path: lab/evidence/kmp-reference-android-runtime.json

  kmp-ios-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out parity lab
        uses: actions/checkout@v4
        with:
          path: lab
          persist-credentials: false
      - name: Check out exact KMP reference
        uses: actions/checkout@v4
        with:
          repository: ed3c/kotlin-auto-webview
          ref: bcb79473eaa6bb2e09f287462aa932a7fdab4957
          path: kmp-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe KMP iOS subject for exact-navigation.v1
        run: |
          mkdir -p lab/evidence
          node lab/harness/kmp-runtime-probe.mjs \
            kmp-reference \
            lab/fixtures/exact-navigation/checkpoint.json \
            lab/evidence/kmp-reference-ios-runtime.json \
            ios
          node lab/harness/validate-runtime-envelope.mjs lab/evidence/kmp-reference-ios-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmp-reference-ios-runtime
          path: lab/evidence/kmp-reference-ios-runtime.json

  android-native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
      - name: Enable KVM group perms
        run: |
          set -euo pipefail
          # Public ubuntu-latest exposes /dev/kvm; default perms are root:kvm 0660 so ProbeKVM
          # falls back to -accel off (EMULATOR_KVM_UNAVAILABLE_ADB_EXIT_224). Documented
          # reactivecircus udev rule + chmod makes the device rw for the job user.
          if [ ! -e /dev/kvm ]; then
            echo "FATAL: /dev/kvm missing; software emulation is too slow/flaky for EMULATOR evidence" >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          python3 -c 'import os; os.open("/dev/kvm", os.O_RDWR); print("KVM rw ok")'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "system-images;android-30;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Host unit path emits ANDROID_NATIVE envelope (runtime_class=HOST)
        run: |
          mkdir -p evidence
          RUNTIME_ENVELOPE_OUT="$PWD/evidence/android-native-host-envelope.json" \
          RUNTIME_CONTROLS_OUT="$PWD/evidence/android-native-host-controls.json" \
            gradle :android-app:testDebugUnitTest --tests 'dev.ed3c.nativeparity.checkpoint.ExactNavigationRuntimeEnvelopeTest' --no-daemon
          test -s evidence/android-native-host-envelope.json
          node harness/validate-runtime-envelope.mjs \
            --require-runtime-class HOST \
            evidence/android-native-host-envelope.json
      - name: Instrumentation on managed emulator (required EMULATOR envelope)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          # reactivecircus runs `script` via /usr/bin/sh (dash) and splits lines;
          # invoke a single bash entrypoint so pipefail + multiline stay intact
          # (EMULATOR_SH_PIPEFAIL_ILLEGAL). Fail-closed EMULATOR validation stays in the script.
          script: bash harness/android-emulator-instrumentation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-runtime
          if-no-files-found: ignore
          path: |
            evidence/android-native-envelope.json
            evidence/android-native-emulator-envelope.json
            evidence/android-native-host-envelope.json
            evidence/android-native-host-controls.json
            evidence/android-native-runtime-status.json
            evidence/android-emulator-instrumentation.log
            evidence/android-emulator-logcat.txt
            evidence/android-emulator-scrape.txt

  ios-native-runtime:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Host package path emits IOS_NATIVE envelope (runtime_class=HOST)
        run: |
          mkdir -p evidence
          RUNTIME_ENVELOPE_OUT="$PWD/evidence/ios-native-host-envelope.json" \
          RUNTIME_CONTROLS_OUT="$PWD/evidence/ios-native-host-controls.json" \
            swift test --package-path ios-app --filter ExactNavigationRuntimeEnvelopeTests
          test -s evidence/ios-native-host-envelope.json
          node harness/validate-runtime-envelope.mjs \
            --require-runtime-class HOST \
            evidence/ios-native-host-envelope.json
      - name: iOS Simulator XCTest (required SIMULATOR envelope)
        run: |
          set -euo pipefail
          mkdir -p evidence DerivedData
          UDID=$(node harness/pick-ios-simulator.mjs)
          echo "Using Simulator UDID=${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          set -o pipefail
          ( cd ios-app && xcodebuild \
              -scheme NativeCheckpointUI \
              -destination "platform=iOS Simulator,id=${UDID}" \
              -derivedDataPath ../DerivedData \
              -only-testing:NativeCheckpointUITests/ExactNavigationSimulatorRuntimeEnvelopeTests \
              test ) | tee evidence/ios-simulator-xcodebuild.log
          # Guest /tmp is not visible to simctl spawn (SIMULATOR_ENVELOPE_FILE_MISSING_AFTER_XCTEST).
          # Harvest compact JSON / base64 markers printed by XCTest into this log.
          node harness/extract-marked-payload.mjs \
            IOS_SIM_ENVELOPE \
            evidence/ios-simulator-xcodebuild.log \
            evidence/ios-native-simulator-envelope.json
          node harness/extract-marked-payload.mjs \
            IOS_SIM_CONTROLS \
            evidence/ios-simulator-xcodebuild.log \
            evidence/ios-native-simulator-controls.json || true
          test -s evidence/ios-native-simulator-envelope.json
          node harness/validate-runtime-envelope.mjs \
            --require-runtime-class SIMULATOR \
            evidence/ios-native-simulator-envelope.json
          # Fail closed: primary IOS_NATIVE artifact must be SIMULATOR, never HOST copy.
          cp evidence/ios-native-simulator-envelope.json evidence/ios-native-envelope.json
          printf '%s\n' '{"subject":"IOS_NATIVE","platform":"ios","status":"PASS","checkpoint_id":"exact-navigation.v1","runtime_class":"SIMULATOR","reason":"iOS Simulator XCTest produced validated SIMULATOR envelope"}' \
            > evidence/ios-native-runtime-status.json
          echo "IOS_NATIVE ceiling candidate: SIMULATOR_RUNTIME_PARITY (simulator SIMULATOR PASS)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-runtime
          if-no-files-found: ignore
          path: |
            evidence/ios-native-envelope.json
            evidence/ios-native-simulator-envelope.json
            evidence/ios-native-host-envelope.json
            evidence/ios-native-host-controls.json
            evidence/ios-native-simulator-controls.json
            evidence/ios-native-runtime-status.json
            evidence/ios-simulator-xcodebuild.log

  runtime-parity:
    needs:
      - envelope-contract
      - kmp-android-reference
      - kmp-ios-reference
      - android-native-runtime
      - ios-native-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: android-native-runtime
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: ios-native-runtime
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: kmp-reference-android-runtime
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: kmp-reference-ios-runtime
          path: evidence
      - name: Compare elevated simulator envelopes when present
        run: |
          set -euo pipefail
          ls -la evidence
          test -s evidence/android-native-envelope.json
          test -s evidence/ios-native-envelope.json
          # Fail closed: primary native envelopes must be elevated classes.
          node harness/validate-runtime-envelope.mjs \
            --require-runtime-class EMULATOR \
            evidence/android-native-envelope.json
          node harness/validate-runtime-envelope.mjs \
            --require-runtime-class SIMULATOR \
            evidence/ios-native-envelope.json
          node harness/compare-runtime-envelopes.mjs \
            evidence/android-native-envelope.json \
            evidence/ios-native-envelope.json \
            evidence/kmp-reference-android-runtime.json \
            evidence/android-native-host-controls.json \
            evidence/ios-native-host-controls.json
          echo "NOTE: HOST envelopes retained as separately labeled artifacts; comparator uses elevated EMULATOR/SIMULATOR natives. KMP ABSENT on pin remains valid."
          if [ -f evidence/android-native-host-envelope.json ] && [ -f evidence/ios-native-host-envelope.json ]; then
            echo "HOST-only report (non-promotable):"
            node harness/compare-runtime-envelopes.mjs \
              evidence/android-native-host-envelope.json \
              evidence/ios-native-host-envelope.json \
              evidence/kmp-reference-android-runtime.json || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-summary
          path: evidence
