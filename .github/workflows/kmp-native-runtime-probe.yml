name: kmp-native-runtime-probe

on:
  pull_request:
  push:
    branches: [probe/kmp-native-runtime]

permissions:
  contents: read

jobs:
  envelope-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node harness/validate-runtime-envelope.mjs --selftest
      - run: node --test harness/validate-runtime-envelope.test.mjs harness/kmp-runtime-probe.test.mjs

  kmp-android-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out parity lab
        uses: actions/checkout@v4
        with:
          path: lab
          persist-credentials: false
      - name: Check out exact KMP reference
        uses: actions/checkout@v4
        with:
          repository: ed3c/kotlin-auto-webview
          ref: bcb79473eaa6bb2e09f287462aa932a7fdab4957
          path: kmp-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe KMP Android subject for exact-navigation.v1
        run: |
          mkdir -p lab/evidence
          node lab/harness/kmp-runtime-probe.mjs \
            kmp-reference \
            lab/fixtures/exact-navigation/checkpoint.json \
            lab/evidence/kmp-reference-android-runtime.json \
            android
          node lab/harness/validate-runtime-envelope.mjs lab/evidence/kmp-reference-android-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmp-reference-android-runtime
          path: lab/evidence/kmp-reference-android-runtime.json

  kmp-ios-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out parity lab
        uses: actions/checkout@v4
        with:
          path: lab
          persist-credentials: false
      - name: Check out exact KMP reference
        uses: actions/checkout@v4
        with:
          repository: ed3c/kotlin-auto-webview
          ref: bcb79473eaa6bb2e09f287462aa932a7fdab4957
          path: kmp-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe KMP iOS subject for exact-navigation.v1
        run: |
          mkdir -p lab/evidence
          node lab/harness/kmp-runtime-probe.mjs \
            kmp-reference \
            lab/fixtures/exact-navigation/checkpoint.json \
            lab/evidence/kmp-reference-ios-runtime.json \
            ios
          node lab/harness/validate-runtime-envelope.mjs lab/evidence/kmp-reference-ios-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmp-reference-ios-runtime
          path: lab/evidence/kmp-reference-ios-runtime.json

  android-native-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "system-images;android-30;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Host unit path emits ANDROID_NATIVE envelope
        run: |
          mkdir -p evidence
          RUNTIME_ENVELOPE_OUT="$PWD/evidence/android-native-host-envelope.json" \
          RUNTIME_CONTROLS_OUT="$PWD/evidence/android-native-controls.json" \
            gradle :android-app:testDebugUnitTest --tests 'dev.ed3c.nativeparity.checkpoint.ExactNavigationRuntimeEnvelopeTest' --no-daemon
          test -s evidence/android-native-host-envelope.json
          node harness/validate-runtime-envelope.mjs evidence/android-native-host-envelope.json
      - name: Instrumentation on emulator (elevation beyond JVM)
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: |
            mkdir -p evidence
            gradle :android-app:connectedDebugAndroidTest --no-daemon
            adb shell "run-as dev.ed3c.nativeparity.checkpoint cat files/android-native-runtime-envelope.json" \
              > evidence/android-native-runtime-envelope.json || true
            if [ ! -s evidence/android-native-runtime-envelope.json ]; then
              adb exec-out run-as dev.ed3c.nativeparity.checkpoint cat files/android-native-runtime-envelope.json \
                > evidence/android-native-runtime-envelope.json || true
            fi
            if [ ! -s evidence/android-native-runtime-envelope.json ]; then
              # Fall back to pulling external files dir if present
              PKG_PATH=$(adb shell pm path dev.ed3c.nativeparity.checkpoint.test | head -1 | tr -d '\r' | cut -d: -f2 || true)
              echo "instrumentation artifact path probe: ${PKG_PATH}"
              find /tmp -name 'android-native-runtime-envelope.json' 2>/dev/null || true
            fi
            if [ -s evidence/android-native-runtime-envelope.json ]; then
              node harness/validate-runtime-envelope.mjs evidence/android-native-runtime-envelope.json
              echo "status=PASS" >> "$GITHUB_OUTPUT"
            else
              echo "status=NOT_EXERCISED" >> "$GITHUB_OUTPUT"
              printf '%s\n' '{"subject":"ANDROID_NATIVE","platform":"android","status":"NOT_EXERCISED","checkpoint_id":"exact-navigation.v1","reason":"emulator instrumentation did not produce pullable envelope artifact; host envelope remains authoritative for this run"}' \
                > evidence/android-native-runtime-status.json
            fi
      - name: Record emulator exercise ceiling
        run: |
          mkdir -p evidence
          if [ "${{ steps.emulator.outcome }}" != "success" ] || [ "${{ steps.emulator.outputs.status }}" != "PASS" ]; then
            printf '%s\n' '{"subject":"ANDROID_NATIVE","platform":"android","status":"NOT_EXERCISED","checkpoint_id":"exact-navigation.v1","reason":"android emulator instrumentation not fully exercised or artifact missing; host ANDROID_NATIVE envelope emitted from JVM unit path"}' \
              > evidence/android-native-runtime-status.json
            cp evidence/android-native-host-envelope.json evidence/android-native-envelope.json
            echo "ANDROID_NATIVE ceiling: HOST_TEST_PARITY (emulator NOT_EXERCISED)"
          else
            cp evidence/android-native-runtime-envelope.json evidence/android-native-envelope.json
            echo "ANDROID_NATIVE ceiling: SIMULATOR_RUNTIME_PARITY candidate (emulator PASS)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-runtime
          path: |
            evidence/android-native-envelope.json
            evidence/android-native-host-envelope.json
            evidence/android-native-controls.json
            evidence/android-native-runtime-status.json
            evidence/android-native-runtime-envelope.json

  ios-native-runtime:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Host package path emits IOS_NATIVE envelope
        run: |
          mkdir -p evidence
          RUNTIME_ENVELOPE_OUT="$PWD/evidence/ios-native-host-envelope.json" \
          RUNTIME_CONTROLS_OUT="$PWD/evidence/ios-native-controls.json" \
            swift test --package-path ios-app --filter ExactNavigationRuntimeEnvelopeTests
          test -s evidence/ios-native-host-envelope.json
          node harness/validate-runtime-envelope.mjs evidence/ios-native-host-envelope.json
          cp evidence/ios-native-host-envelope.json evidence/ios-native-envelope.json
      - name: iOS Simulator XCTest status
        run: |
          # Honest ceiling: this PR does not wire an .xcodeproj / xcodebuild Simulator destination.
          printf '%s\n' '{"subject":"IOS_NATIVE","platform":"ios","status":"NOT_EXERCISED","checkpoint_id":"exact-navigation.v1","reason":"iOS Simulator XCTest not wired (SwiftPM host tests only); no SIMULATOR_RUNTIME_PARITY claim"}' \
            > evidence/ios-native-runtime-status.json
          echo "IOS_NATIVE ceiling: HOST_TEST_PARITY (simulator NOT_EXERCISED)"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-native-runtime
          path: |
            evidence/ios-native-envelope.json
            evidence/ios-native-host-envelope.json
            evidence/ios-native-controls.json
            evidence/ios-native-runtime-status.json

  runtime-parity:
    needs:
      - envelope-contract
      - kmp-android-reference
      - kmp-ios-reference
      - android-native-runtime
      - ios-native-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: android-native-runtime
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: ios-native-runtime
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: kmp-reference-android-runtime
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: kmp-reference-ios-runtime
          path: evidence
      - name: Compare runtime envelopes with fingerprinting
        run: |
          ls -la evidence
          node harness/compare-runtime-envelopes.mjs \
            evidence/android-native-envelope.json \
            evidence/ios-native-envelope.json \
            evidence/kmp-reference-android-runtime.json \
            evidence/android-native-controls.json \
            evidence/ios-native-controls.json
          echo "NOTE: KMP iOS reference receipt retained as measurement artifact; comparator uses one KMP absence receipt plus native envelopes."
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-parity-summary
          path: evidence
